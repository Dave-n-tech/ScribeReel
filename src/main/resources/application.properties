spring.application.name=ScribeReel

# Server
server.port=8080

# Groq API
groq.api.base-url=https://api.groq.com
groq.api.model=whisper-large-v3

# ScribeReel app config (binds to AppPropertiesConfig)
scribereel.max-duration-seconds=60
scribereel.max-file-size=100
scribereel.rate-limit-window-minutes=2
scribereel.temp-file-ttl-minutes=15
scribereel.ffmpeg-timeout-minutes=5
scribereel.rate-limit-max-requests=1
scribereel.rate-limit-max-requests-convert=5

# Spring multipart upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Active profile (override with -Dspring.profiles.active=prod at deploy time)
spring.profiles.active=local

feign.client.config.groq-client.connect-timeout=10000
feign.client.config.groq-client.read-timeout=60000

